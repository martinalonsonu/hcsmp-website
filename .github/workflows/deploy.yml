name: Deploy static site to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Configure Pages paths
        id: pages-paths
        shell: bash
        env:
          SITE_URL_OVERRIDE: ${{ vars.NEXT_PUBLIC_SITE_URL }}
          BASE_PATH_OVERRIDE: ${{ vars.NEXT_PUBLIC_BASE_PATH }}
        run: |
          if [[ -n "$SITE_URL_OVERRIDE" ]]; then
            base_path="$BASE_PATH_OVERRIDE"
            site_url="${SITE_URL_OVERRIDE%/}"
          elif [[ "$GITHUB_REPOSITORY" == "$GITHUB_REPOSITORY_OWNER/$GITHUB_REPOSITORY_OWNER.github.io" ]]; then
            base_path=""
            site_url="https://${GITHUB_REPOSITORY_OWNER}.github.io"
          else
            base_path="/${GITHUB_REPOSITORY#*/}"
            site_url="https://${GITHUB_REPOSITORY_OWNER}.github.io"
          fi
          echo "base_path=$base_path" >> "$GITHUB_OUTPUT"
          echo "site_url=$site_url" >> "$GITHUB_OUTPUT"

      - name: Install dependencies
        run: npm ci

      - name: Build static export
        run: npm run build
        env:
          NEXT_PUBLIC_BASE_PATH: ${{ steps.pages-paths.outputs.base_path }}
          NEXT_PUBLIC_SITE_URL: ${{ steps.pages-paths.outputs.site_url }}

      - name: Disable Jekyll processing
        run: touch out/.nojekyll

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./out

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
