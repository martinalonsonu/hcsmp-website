name: Deploy static site to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  security:
    name: GHAS vulnerability gate
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      security-events: write
      vulnerability-alerts: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: javascript-typescript

      - name: Analyze with CodeQL
        uses: github/codeql-action/analyze@v4

      - name: Enforce GHAS alert thresholds
        uses: actions/github-script@v9
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const limits = { critical: 0, high: 0, moderate: 10, low: 100 };
            const counts = {
              critical: 0,
              high: 0,
              moderate: 0,
              low: 0,
            };
            const sourceCounts = {
              codeScanning: { critical: 0, high: 0, moderate: 0, low: 0 },
              dependabot: { critical: 0, high: 0, moderate: 0, low: 0 },
            };
            const normalizeSeverity = (severity) =>
              severity === "medium" ? "moderate" : severity;

            const codeAlerts = await github.paginate(
              github.rest.codeScanning.listAlertsForRepo,
              {
                owner,
                repo,
                state: "open",
                ref: context.ref,
                per_page: 100,
              },
            );

            for (const alert of codeAlerts) {
              const severity = normalizeSeverity(
                alert.rule.security_severity_level,
              );
              if (Object.hasOwn(counts, severity)) {
                counts[severity] += 1;
                sourceCounts.codeScanning[severity] += 1;
              }
            }

            const dependabotAlerts = await github.paginate(
              github.rest.dependabot.listAlertsForRepo,
              { owner, repo, state: "open", per_page: 100 },
            );

            for (const alert of dependabotAlerts) {
              const bucket = normalizeSeverity(
                alert.security_vulnerability.severity,
              );
              if (Object.hasOwn(counts, bucket)) {
                counts[bucket] += 1;
                sourceCounts.dependabot[bucket] += 1;
              }
            }

            const severityLabels = {
              critical: "Crítica",
              high: "Alta",
              moderate: "Moderada",
              low: "Baja",
            };
            const rows = Object.keys(limits).map((severity) => {
              const withinLimit = counts[severity] <= limits[severity];
              return [
                severityLabels[severity],
                String(sourceCounts.codeScanning[severity]),
                String(sourceCounts.dependabot[severity]),
                String(counts[severity]),
                String(limits[severity]),
                withinLimit ? "✅ Dentro del límite" : "❌ Supera el límite",
              ];
            });

            await core.summary
              .addHeading("Resumen de vulnerabilidades GHAS")
              .addTable([
                [
                  "Severidad",
                  "CodeQL",
                  "Dependabot",
                  "Total",
                  "Máximo",
                  "Estado",
                ],
                ...rows,
              ])
              .addRaw(
                `Se contaron alertas abiertas de seguridad de código y Dependabot.`,
              )
              .write();

            const exceeded = Object.entries(limits)
              .filter(([severity, maximum]) => counts[severity] > maximum)
              .map(([severity, maximum]) => `${severity}: ${counts[severity]} > ${maximum}`);

            if (exceeded.length > 0) {
              core.setFailed(`GHAS limits exceeded: ${exceeded.join(", ")}`);
            }

  build:
    needs: security
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pages: write
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Configure GitHub Pages
        id: pages-paths
        uses: actions/configure-pages@v6

      - name: Install pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Enforce 75% coverage gate
        run: pnpm test:coverage

      - name: Build static export
        run: pnpm build
        env:
          NEXT_PUBLIC_BASE_PATH: ""          
          NEXT_PUBLIC_SITE_URL: "https://hermandadsanmartinhuacho.org"

      - name: Disable Jekyll processing
        run: touch out/.nojekyll

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./out

  deploy:
    runs-on: ubuntu-24.04
    needs: build
    permissions:
      pages: write
      id-token: write
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
