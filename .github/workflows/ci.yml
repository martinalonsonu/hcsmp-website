name: Pull request validation

on:
  pull_request:
    branches: [main]
  merge_group:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  security:
    name: Branch vulnerability thresholds
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Checkout pull request merge commit
        uses: actions/checkout@v7

      - name: Install pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Initialize CodeQL analysis
        uses: github/codeql-action/init@v4
        with:
          languages: javascript-typescript

      - name: Analyze branch without uploading results
        id: codeql
        uses: github/codeql-action/analyze@v4
        with:
          output: ${{ runner.temp }}/codeql-results
          upload: never

      - name: Audit dependencies from the branch lockfile
        id: dependency-audit
        run: pnpm audit --json > branch-audit.json
        continue-on-error: true

      - name: Enforce branch vulnerability thresholds
        env:
          CODEQL_SARIF_DIR: ${{ runner.temp }}/codeql-results
        run: node scripts/check-branch-vulnerabilities.mjs

  quality:
    name: Lint, tests, build, and export validation
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout pull request merge commit
        uses: actions/checkout@v7

      - name: Install pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Enforce 75% coverage gate
        run: pnpm test:coverage

      - name: Build static export
        run: pnpm build
        env:
          NEXT_PUBLIC_BASE_PATH: ""
          NEXT_PUBLIC_SITE_URL: "https://hermandadsanmartinhuacho.org"

      - name: Validate static export routes and links
        run: pnpm validate:export
        env:
          NEXT_PUBLIC_BASE_PATH: ""
          NEXT_PUBLIC_SITE_URL: "https://hermandadsanmartinhuacho.org"

  merge-gate:
    name: Required merge gate
    if: always()
    needs: [security, quality]
    runs-on: ubuntu-24.04
    steps:
      - name: Require security and quality checks
        env:
          SECURITY_RESULT: ${{ needs.security.result }}
          QUALITY_RESULT: ${{ needs.quality.result }}
        run: |
          if [[ "$SECURITY_RESULT" != "success" || "$QUALITY_RESULT" != "success" ]]; then
            echo "Pull request blocked: security=$SECURITY_RESULT, quality=$QUALITY_RESULT"
            exit 1
          fi
